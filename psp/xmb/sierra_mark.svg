    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaeff2"/>
      <stop offset="0.33" stop-color="#b2bcc5"/>
      <stop offset="0.39" stop-color="#68737d"/>
      <stop offset="1" stop-color="#abb5bd"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c29b63"/>
      <stop offset="1" stop-color="#a06e26"/>
    </linearGradient>
  </defs>
