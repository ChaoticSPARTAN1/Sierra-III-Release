<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 608 168" width="608" height="168" role="img" aria-label="Sierra-III PSP">
  <!-- The Sierra-III mark, the vector master for every use (XMB tile, wallpaper, README).
       Lettering drawn on its own system: monoline, 45-degree chamfers, open ends cut "/",
       two slashes through the back of the P's and R's bowls. PSP spans the III exactly.
       The slate chrome and amber are shared with the game title on the wallpaper.
       Drop shadows are added by whatever renders it, so the master stays flat. -->
  <defs>
